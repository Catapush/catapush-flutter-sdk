name: catapush_flutter_sdk_example
description: Demonstrates how to use the catapush_flutter_sdk plugin.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  catapush_flutter_sdk:
    path: ../

  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  mime: ^2.0.0
  image_picker: ^1.2.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true